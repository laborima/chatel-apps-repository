# ForwardAuth target for Traefik: 204 when the verified client certificate CN is
# allowlisted, 403 otherwise. Reachable only on the internal Docker network.

worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Traefik sends the subject URL-encoded: Subject%3D%22CN%3D<name>%22
    map $http_x_forwarded_tls_client_cert_info $client_allowed {
        default 0;
        include /etc/nginx/cert-check/allowed-clients.map;
    }

    server {
        listen 8080;

        location / {
            if ($client_allowed) {
                return 204;
            }
            return 403;
        }
    }
}
