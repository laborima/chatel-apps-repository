name: Chatel Apps Publish

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ./chatel-meteo-planner/package-lock.json
            ./about-matthieu/site/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        working-directory: ./chatel-meteo-planner
        run: npm ci

      - name: Build project
        working-directory: ./chatel-meteo-planner
        env:
          NODE_ENV: production
        run: npm run build

      # About Matthieu (profile page + the Ride windsurf / wing foil game), published under /about-matthieu/
      - name: Install about-matthieu dependencies
        working-directory: ./about-matthieu/site
        run: npm ci

      - name: Build about-matthieu
        working-directory: ./about-matthieu/site
        run: npm run build

      - name: Add about-matthieu to the site
        run: cp -r ./about-matthieu/site/dist ./chatel-meteo-planner/out/about-matthieu

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./chatel-meteo-planner/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
