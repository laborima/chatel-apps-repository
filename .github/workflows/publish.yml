name: Chatel Apps Publish

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ./chatel-meteo-planner/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        working-directory: ./chatel-meteo-planner
        run: npm ci

      - name: Build project
        working-directory: ./chatel-meteo-planner
        env:
          NODE_ENV: production
        run: npm run build

      # About Matthieu now lives at https://laborima.github.io/ (built from about-matthieu/site by the
      # laborima/laborima.github.io workflow): the old address redirects there, keeping #windsurf
      - name: Redirect about-matthieu
        run: |
          mkdir -p ./chatel-meteo-planner/out/about-matthieu
          cat > ./chatel-meteo-planner/out/about-matthieu/index.html <<'HTML'
          <!doctype html>
          <html lang="fr">
          <head>
          <meta charset="utf-8">
          <title>Matthieu Laborie</title>
          <link rel="canonical" href="https://laborima.github.io/">
          <meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=https://laborima.github.io/">
          <script>location.replace('https://laborima.github.io/' + location.hash);</script>
          </head>
          <body><p>La page a déménagé : <a href="https://laborima.github.io/">laborima.github.io</a></p></body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./chatel-meteo-planner/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
